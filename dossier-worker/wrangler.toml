name = "dronesudxpert-dossiers"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# One run per day at 03:00 UTC — deletes any dossier past its expiry date.
[triggers]
crons = ["0 3 * * *"]

[[r2_buckets]]
binding = "DOSSIERS_BUCKET"
bucket_name = "dronesudxpert-dossiers"

[[kv_namespaces]]
binding = "DOSSIERS_KV"
id = "fb2c3d0f6756480298b1d54f637e6f46"

[vars]
# Comma-separated list of origins allowed to call this API from the browser.
ALLOWED_ORIGIN = "https://dronesudxpert.com"
R2_ACCOUNT_ID = "008b22de7631ba6fb92f3fa095ecc24e"
R2_BUCKET_NAME = "dronesudxpert-dossiers"

# ADMIN_PASSWORD, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are set as secrets,
# via the GitHub Action (see .github/workflows/deploy-dossier-worker.yml)
